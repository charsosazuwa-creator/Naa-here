<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naa here - Provider portal</title>
<link rel="stylesheet" href="../auth/tokens.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="no-tenant">
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img src="../auth/assets/logo.png" alt="" />
      <span>- Provider portal</span>
    </div>
    <div class="topbar-right">
      <select id="tenant-select" class="tenant-select" hidden></select>
      <span id="user-name" style="font-size:0.88rem;color:var(--color-text-muted)"></span>
      <button class="btn-plain" id="sign-out-btn">Sign out</button>
    </div>
  </header>

  <aside class="sidebar" id="sidebar" hidden>
    <nav id="sidebar-nav"></nav>
  </aside>

  <main class="content" id="view"></main>
</div>

<script src="api.js"></script>
<script src="../shared/listing-ui.js"></script>
<script src="../shared/dispute-ui.js"></script>
<script src="../shared/realtime-ws.js"></script>
<script src="../shared/call-ui.js"></script>
<script src="app.js"></script>
</body>
</html>
