<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naa here — Reset password</title>
<link rel="stylesheet" href="tokens.css" />
</head>
<body>
<main class="card">
  <img src="assets/logo.png" alt="Naa here" style="height:40px;display:block;margin-bottom:var(--space-3)" />
  <h1>Reset your password</h1>
  <p class="subtitle">Enter the code you received and choose a new password.</p>

  <div id="alert" class="alert error" role="alert" hidden></div>

  <form id="reset-form" novalidate>
    <div class="field">
      <label for="identifier">Email or phone</label>
      <input id="identifier" name="identifier" type="text" required />
    </div>
    <div class="field">
      <label for="code">6-digit code</label>
      <input id="code" name="code" type="text" inputmode="numeric" maxlength="6" required />
    </div>
    <div class="field">
      <label for="newPassword">New password</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8" />
    </div>
    <button class="primary" type="submit" id="submit-btn">Reset password</button>
  </form>

  <p class="links"><a href="signin.html">Back to sign in</a></p>
</main>

<script src="api.js"></script>
<script src="reset-password.js"></script>
</body>
</html>
