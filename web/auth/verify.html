<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naa here — Verify your account</title>
<link rel="stylesheet" href="tokens.css" />
</head>
<body>
<main class="card">
  <img src="assets/logo.png" alt="Naa here" style="height:40px;display:block;margin-bottom:var(--space-3)" />
  <h1>Enter your verification code</h1>
  <p class="subtitle" id="subtitle">We sent a 6-digit code to your email or phone. Enter it below to continue.</p>

  <div id="alert" class="alert error" role="alert" hidden></div>

  <form id="verify-form" novalidate>
    <div class="field">
      <label for="code">6-digit code</label>
      <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus />
    </div>
    <button class="primary" type="submit" id="submit-btn">Verify</button>
  </form>

  <p class="links">Didn't get a code? <a href="#" id="resend-link">Resend it</a></p>
</main>

<script src="api.js"></script>
<script src="verify.js"></script>
</body>
</html>
