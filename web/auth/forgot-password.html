<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naa here — Forgot password</title>
<link rel="stylesheet" href="tokens.css" />
</head>
<body>
<main class="card">
  <img src="assets/logo.png" alt="Naa here" style="height:40px;display:block;margin-bottom:var(--space-3)" />
  <h1>Forgot your password?</h1>
  <p class="subtitle">Enter the email or phone you registered with. We'll always show the same message, whether or not it matches an account.</p>

  <div id="alert" class="alert" role="alert" hidden></div>

  <form id="forgot-form" novalidate>
    <div class="field">
      <label for="identifier">Email or phone</label>
      <input id="identifier" name="identifier" type="text" required />
    </div>
    <button class="primary" type="submit" id="submit-btn">Send reset code</button>
  </form>

  <p class="links"><a href="reset-password.html">I already have a code</a> · <a href="signin.html">Back to sign in</a></p>
</main>

<script src="api.js"></script>
<script>
  const form = document.getElementById('forgot-form');
  const alertBox = document.getElementById('alert');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const identifier = form.identifier.value.trim();
    const payload = identifier.includes('@') ? { email: identifier } : { phone: identifier };

    try {
      const result = await AuthApi.forgotPassword(payload);
      alertBox.textContent = result.message;
      alertBox.className = 'alert success';
      alertBox.hidden = false;
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.className = 'alert error';
      alertBox.hidden = false;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send reset code';
    }
  });
</script>
</body>
</html>
