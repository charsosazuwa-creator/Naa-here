<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Naa here — Create your customer account</title>
<link rel="stylesheet" href="tokens.css" />
</head>
<body>
<main class="card">
  <img src="assets/logo.png" alt="Naa here" style="height:40px;display:block;margin-bottom:var(--space-3)" />
  <h1>Create your customer account</h1>
  <p class="subtitle">Browse, book, and request services from local businesses.</p>

  <div id="alert" class="alert error" role="alert" hidden></div>

  <form id="signup-form" novalidate>
    <div class="field">
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" type="text" autocomplete="name" required />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
      <div class="hint">Or use a phone number below instead — one of the two is required.</div>
    </div>
    <div class="field">
      <label for="phone">Phone (E.164, e.g. +2348012345678)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
      <div class="hint">At least 8 characters, with letters and digits.</div>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" />
    </div>
    <div class="field-checkbox">
      <input id="terms" name="terms" type="checkbox" required />
      <label for="terms">I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms and Conditions</a></label>
    </div>
    <button class="primary" type="submit" id="submit-btn">Create account</button>
  </form>

  <p class="links"><a href="signup.html">&larr; Choose a different account type</a></p>
  <p class="links">Already have an account? <a href="signin.html">Sign in</a></p>
</main>

<script src="api.js"></script>
<script src="signup-customer.js"></script>
</body>
</html>
