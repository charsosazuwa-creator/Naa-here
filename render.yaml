# Render Blueprint: deploys the whole app — API + database + the
# static web front end (served by the API itself, see api/src/main.ts)
# — as one web service plus one managed Postgres database.
#
# To use: push this repo to GitHub, then in the Render dashboard choose
# "New +" > "Blueprint" and point it at the repo. Render reads this
# file and provisions everything below in one go. See the deployment
# guide for the exact click-by-click steps.
#
# If your Render account doesn't offer a free Postgres plan when this
# runs, change `plan: free` under `databases` to the cheapest plan
# Render currently offers — nothing else in this file needs to change.

databases:
  - name: naa-here-db
    plan: free
    databaseName: marketplace
    user: naa_here_admin

services:
  - type: web
    name: naa-here-app
    runtime: node
    plan: free
    rootDir: .
    # --include=dev is required: NODE_ENV=production below makes npm
    # ci skip devDependencies by default, which would leave out
    # @nestjs/cli (the `nest` command that builds the API) and fail
    # the build with "nest: not found".
    buildCommand: cd api && npm ci --include=dev && npm run build
    startCommand: node api/scripts/deploy-start.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      # Render's managed Postgres requires TLS with a certificate not
      # in Node's default trust store — see configuration.ts's pgSsl.
      - key: PGSSL
        value: "true"
      # Render fills this in with the naa-here-db connection string
      # (an owner/admin role). deploy-start.js runs migrations with
      # it, then swaps to the app_runtime role below before starting
      # the API — see db/migrations/003_app_runtime_role.sql for why.
      - key: DATABASE_URL
        fromDatabase:
          name: naa-here-db
          property: connectionString
      - key: APP_RUNTIME_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: VERIFICATION_CODE_TTL_MINUTES
        value: "15"
      - key: VERIFICATION_CODE_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      # Empty on purpose: the web pages are served from this same
      # origin (see main.ts), so no browser cross-origin requests ever
      # happen and CORS has nothing to allow.
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      # Verification-code email delivery (see
      # api/src/modules/notifications/). Defaults to 'mock', which just
      # logs codes to the server log — the same behavior this app has
      # always had, so a fresh Blueprint deploy still works with zero
      # extra setup. Set EMAIL_PROVIDER to 'resend' and fill in
      # RESEND_API_KEY (from https://resend.com) in the Render
      # dashboard — not here, so the key never ends up committed to
      # the repo — to send real verification emails.
      - key: EMAIL_PROVIDER
        value: mock
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: onboarding@resend.dev
      - key: EMAIL_FROM_NAME
        value: Naa here
      # Bootstraps who holds the 'administrator' platform role (see
      # api/scripts/deploy-start.js's grantBootstrapAdmins and
      # db/migrations/005_admin_finance.sql) — comma-separated emails.
      # Not set here on purpose: fill it in via the Render dashboard,
      # not committed, since it names who gets admin access. Runs on
      # every start and is safe to leave set permanently; if someone
      # listed hasn't signed up yet it just logs and retries on the
      # next deploy/restart.
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      # This service's own public URL, e.g.
      # https://naa-here-app.onrender.com (no trailing slash). Used to
      # build the OAuth redirect_uri Google/Facebook send users back
      # to, and the final redirect back into the web app once a
      # Google/Facebook sign-in completes (see
      # api/src/modules/identity/oauth.*). Fill in via the Render
      # dashboard once you know this service's actual .onrender.com
      # URL (or your custom domain) — it isn't known until the first
      # deploy.
      - key: PUBLIC_BASE_URL
        sync: false
      # "Sign in with Google" / "Sign in with Facebook". Both are
      # optional: leaving a provider's clientId/clientSecret unset just
      # makes its "Continue with ..." button show a
      # "not set up yet" message instead of failing at build/deploy
      # time. Get these from Google Cloud Console (APIs & Services >
      # Credentials > OAuth client ID, type "Web application") and
      # Facebook for Developers (an app with the Facebook Login
      # product added) — the exact redirect URI to register with each
      # is PUBLIC_BASE_URL + /v1/auth/google/callback (or
      # /v1/auth/facebook/callback). Set via the Render dashboard, not
      # here, so neither secret ends up committed to the repo.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      # US-005: Google Places search. Optional — leaving this unset
      # makes the marketplace's "Nearby on Google" results section show
      # a "not set up yet" message instead of failing. Get a key from
      # Google Cloud Console (APIs & Services > Credentials), with the
      # "Places API" enabled for it, then restrict the key to that API
      # before pasting it in here via the Render dashboard.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # US-006/US-007: natural-language AI search. Optional — leaving
      # this unset makes AI search fall back to plain keyword search.
      # Get a key from console.anthropic.com (Settings > API keys).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
